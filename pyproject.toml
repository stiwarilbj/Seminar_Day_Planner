[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seminar-day-planner"
version = "1.0.0"
description = "A local, privacy-first Seminar Day scheduling app for Dover-Sherborn High School."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fpdf2>=2.8,<3",
  "nicegui>=3.0,<4",
  "openpyxl>=3.1,<4",
  "ortools>=9.12,<10",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
